<script>
	var data = [];
	var dataAvg = {};
	var dataAvgDelta = {};
	var dataHistory = {};
	var VARIABLES = {};
	var SUBSCRIPTIONS = [];

	// Subscription to GET variables for continuous update
	function subscribeToVar(variable) {
		if (!VARIABLES.GET.includes(variable) || SUBSCRIPTIONS.includes(variable)) return;
		SUBSCRIPTIONS.push(variable);
	}

	// Subscribe variables used in other functions of this page
	function initSubscribers() {
		subscribeToVar("COOLANT_CORE_QUANTITY_IN_VESSEL");
		subscribeToVar("COOLANT_CORE_PRIMARY_LOOP_LEVEL");
		subscribeToVar("CORE_TEMP");
		subscribeToVar("CORE_TEMP_OPERATIVE");
		subscribeToVar("CORE_STEAM_PRESENT");
		subscribeToVar("CORE_HIGH_STEAM_PRESENT");
		subscribeToVar("CORE_WEAR");
		subscribeToVar("CORE_INTEGRITY");
		subscribeToVar("RODS_POS_ACTUAL");
		subscribeToVar("CORE_CRITICAL_MASS_REACHED");
		subscribeToVar("CORE_STATE_CRITICALITY");
		subscribeToVar("FREIGHT_PUMP_CONDENSER_ACTIVE");
		subscribeToVar("FREIGHT_PUMP_EXTERNAL_ACTIVE");
		subscribeToVar("FREIGHT_PUMP_INTERNAL_ACTIVE");

		for (var i = 0; i < 3; i++) {
			subscribeToVar(`COOLANT_CORE_CIRCULATION_PUMP_${i}_STATUS`);
			subscribeToVar(`COOLANT_CORE_CIRCULATION_PUMP_${i}_SPEED`);
			subscribeToVar(`COOLANT_CORE_CIRCULATION_PUMP_${i}_DRY_STATUS`);
			subscribeToVar(`STEAM_TURBINE_${i}_RPM`);
			subscribeToVar(`STEAM_TURBINE_${i}_PRESSURE`);
		}

		for (var i = 0; i < 3; i++) {
			subscribeToVar(`STEAM_TURBINE_${i}_TEMPERATURE`);
			subscribeToVar(`GENERATOR_${i}_KW`);
			subscribeToVar(`GENERATOR_${i}_BREAKER`);
		}

		for (var i = 0; i < 3; i++) {
			subscribeToVar(`COOLANT_SEC_CIRCULATION_PUMP_${i}_STATUS`);
			subscribeToVar(`COOLANT_SEC_CIRCULATION_PUMP_${i}_SPEED`);
			subscribeToVar(`COOLANT_SEC_CIRCULATION_PUMP_${i}_DRY_STATUS`);
			subscribeToVar(`STEAM_TURBINE_${i}_BYPASS_ACTUAL`);
			subscribeToVar(`MSCV_${i}_OPENING_ACTUAL`);
			subscribeToVar(`COOLANT_SEC_${i}_VOLUME`);
			subscribeToVar(`COOLANT_SEC_${i}_TEMPERATURE`);
		}

		subscribeToVar("CONDENSER_CIRCULATION_PUMP_SPEED");
		subscribeToVar("CONDENSER_CIRCULATION_PUMP_STATUS");
		subscribeToVar("CONDENSER_CIRCULATION_PUMP_DRY_STATUS");
		subscribeToVar("CONDENSER_VOLUME");
		subscribeToVar("CONDENSER_TEMPERATURE");
	}

	// This function updates the SVG elements with the latest values from the webserver in Nucleares
	function updateSVGValues() {
		// Pre-core
		$("#InternalFreight").css("fill", data.FREIGHT_PUMP_INTERNAL_ACTIVE == 1 ? "green" : "grey");
		$("#ExternalFreight").css("fill", data.FREIGHT_PUMP_EXTERNAL_ACTIVE == 1 ? "green" : "grey");

		// Core
		$(".CorePoolGradient").attr("offset", data.COOLANT_CORE_QUANTITY_IN_VESSEL + "%");
		$("#CoreVesselGradBlue").attr("stop-color", data.CORE_TEMP >= data.CORE_TEMP_OPERATIVE ? "rgb(" + ((data.CORE_TEMP - data.CORE_TEMP_OPERATIVE) * 10) + ",0,255)" : "rgb(0,0," + (255 - (data.CORE_TEMP_OPERATIVE - data.CORE_TEMP) * 10) + ")");
		$("#CoreVesselGradGrey").attr("stop-color", data.CORE_STEAM_PRESENT == "FALSE" ? "darkgrey" : data.CORE_HIGH_STEAM_PRESENT == "TRUE" ? "red" : "brown");

		$(".CoreVesselGradient").attr("offset", data.COOLANT_CORE_PRIMARY_LOOP_LEVEL + "%");
		$("#CoreVessel").css("stroke-dasharray", (10 - data.CORE_WEAR / 10) + " " + (data.CORE_WEAR / 10));
		$("#CoreVesselInteg").css("stroke-dasharray", (10 - data.CORE_INTEGRITY / 10) + " " + (data.CORE_INTEGRITY / 10));
		$("#ControlRods").attr("y", -140 + (data.RODS_POS_ACTUAL * 1.6));

		$("#CoreFuel").css("fill", data.CORE_CRITICAL_MASS_REACHED == "FALSE" ? "black" : data.CORE_STATE_CRITICALITY >= 0 ? ("rgb(255," + (data.CORE_STATE_CRITICALITY * 500) + ",0)") : ("rgb(" + (255 - data.CORE_STATE_CRITICALITY * 500) + ",0,0)"));

		// Primary Loop
		for (var i = 0; i < 3; i++) {
			let pumpStroke = "white";
			switch (data[`COOLANT_CORE_CIRCULATION_PUMP_${i}_STATUS`]) {
				case 0: pumpStroke = "black"; break;
				case 1: pumpStroke = "purple"; break;
				case 2: pumpStroke = "green"; break;
				case 3: pumpStroke = "red"; break;
				case 4: pumpStroke = "lightgrey"; break;
				case 5: pumpStroke = "brown"; break;
			}
			$(`#PrimaryPump${i + 1}`)
				.css("stroke", pumpStroke)
				.css("fill", data[`COOLANT_CORE_CIRCULATION_PUMP_${i}_DRY_STATUS`] == 1 ? "brown" : `url(#GradGreen${data[`COOLANT_CORE_CIRCULATION_PUMP_${i}_SPEED`]})`);
		}

		// Secondary Loop
		for (var i = 0; i < 3; i++) {
			let pumpStroke = "white";
			switch (data[`COOLANT_SEC_CIRCULATION_PUMP_${i}_STATUS`]) {
				case 0: pumpStroke = "black"; break;
				case 1: pumpStroke = "purple"; break;
				case 2: pumpStroke = "green"; break;
				case 3: pumpStroke = "red"; break;
				case 4: pumpStroke = "lightgrey"; break;
				case 5: pumpStroke = "brown"; break;
			}
			$(`#L2Pump${i + 1}`)
				.css("stroke", pumpStroke)
				.css("fill", data[`COOLANT_SEC_CIRCULATION_PUMP_${i}_DRY_STATUS`] == 1 ? "brown" : `url(#GradGreen${data[`COOLANT_SEC_CIRCULATION_PUMP_${i}_SPEED`]})`);

			$(`#L2ValveBypass${i + 1}`).css("fill", `url(#GradGreen${data[`STEAM_TURBINE_${i}_BYPASS_ACTUAL`]})`);
			$(`#L2ValveActive${i + 1}`).css("fill", `url(#GradGreen${data[`MSCV_${i}_OPENING_ACTUAL`]})`);

			let volume = data[`COOLANT_SEC_${i}_VOLUME`] || 0;
			let fillOffset = 0;
			if (volume > 0 && volume <= 30000) {
				fillOffset = volume / 30000 * 75;
			} else if (volume > 30000) {
				fillOffset = 75 + ((volume - 30000) / 30000) * 25;
			}
			$(`#SteamGen${i + 1}Out`).css("fill", `url(#SteamGenGradient${i})`);
			$(`#SteamGenGradient${i} stop:first-child`).attr("offset", `${fillOffset}%`);
			$(`#SteamGenGradient${i} stop:last-child`).attr("offset", `${fillOffset}%`);
			$(`#SteamGen${i + 1}SteamTemp`).text(Math.round(data[`COOLANT_SEC_${i}_TEMPERATURE`]) + " °C");
		}

		// Electric Generators
		function setFanSpeed(id, RPM) {
			let at = $("#" + id + " > animateTransform");
			let dur = (10 - 9*(RPM/3060)) + "s";
			let rc = RPM == 0 ? "0" : "indefinite";
			if (at.attr("dur") != dur) at.attr("dur", dur);
			if (at.attr("repeatCount") != rc) at.attr("repeatCount", rc);
		}
		for (var i = 0; i < 3; i++) {
			$(`#Turbine${i + 1}Fan`).css("fill", `url(#GradGreen${Math.floor((data[`STEAM_TURBINE_${i}_PRESSURE`] - 0) * 1.5)})`);
			setFanSpeed(`Turbine${i + 1}Fan`, data[`STEAM_TURBINE_${i}_RPM`]);
		}
		for (var i = 0; i < 3; i++) {
			$(`#ElecGen${i + 1}SteamInTemp`).text(Math.round(data[`STEAM_TURBINE_${i}_TEMPERATURE`]) + " °C");
			$(`#ElecGen${i + 1}`).css("fill", data[`GENERATOR_${i}_KW`] == 0 ? "grey" : data[`GENERATOR_${i}_BREAKER`] == "FALSE" ? "green" : "brown");
			$(`#ElecGen${i + 1}Text`).text(Math.round(data[`GENERATOR_${i}_KW`] / 1000) + " kW");
			$(`#ElecGen${i + 1}Text2`).text(Math.round(data[`STEAM_TURBINE_${i}_PRESSURE`]) + " kPa");
		}

		// Tertiary Loop
		$("#CondenserRefil").css("fill", data.FREIGHT_PUMP_CONDENSER_ACTIVE == 1 ? "green" : "grey");

		let condenserPumpStroke = "white";
		switch (data.CONDENSER_CIRCULATION_PUMP_STATUS) {
			case "0": condenserPumpStroke = "black"; break;
			case "1": condenserPumpStroke = "purple"; break;
			case "2": condenserPumpStroke = "green"; break;
			case "3": condenserPumpStroke = "red"; break;
			case "4": condenserPumpStroke = "lightgrey"; break;
			case "5": condenserPumpStroke = "brown"; break;
		}
		$("#CoolingPump")
			.css("stroke", condenserPumpStroke)
			.css("fill", data.CONDENSER_CIRCULATION_PUMP_DRY_STATUS == 1 ? "brown" : `url(#GradGreen${data.CONDENSER_CIRCULATION_PUMP_SPEED})`);

		let condenserVolume = data.CONDENSER_VOLUME || 0;
		let condenserFillOffset = Math.min(condenserVolume / 360000, 1) * 100;
		$("#CondenserOuter").css("fill", `url(#CondenserGradient)`);
		$("#CondenserGradient stop:first-child").attr("offset", `${condenserFillOffset}%`);
		$("#CondenserGradient stop:last-child").attr("offset", `${condenserFillOffset}%`);
		$("#CondenserTemp").text((Math.round(data.CONDENSER_TEMPERATURE * 100) / 100) + " °C");
		$("#CondenserTempDelta").text((dataAvgDelta.CONDENSER_TEMPERATURE >= 0 ? "+" : "") + (Math.round(dataAvgDelta.CONDENSER_TEMPERATURE * 10000) / 10000));
	}

	// This function runs every 10 seconds to automate various tasks based on user and system input
	function automateLoop() {
		// Check if the user has enabled the auto mode for the condenser temperature
		if ($("#GoalCondenserTempEnabled").is(":checked")) {
			let setpoint = parseFloat($("#GoalCondenserTempSetpoint").val());
			if (!isNaN(setpoint)) {
				if (dataAvgDelta.CONDENSER_TEMPERATURE < 0 && dataAvg.CONDENSER_TEMPERATURE < setpoint) {
					sendValue("CONDENSER_CIRCULATION_PUMP_ORDERED_SPEED", Math.max(0, data.CONDENSER_CIRCULATION_PUMP_SPEED - 1), data.CONDENSER_CIRCULATION_PUMP_SPEED);
				} else if (dataAvgDelta.CONDENSER_TEMPERATURE > 0 && dataAvg.CONDENSER_TEMPERATURE > setpoint) {
					sendValue("CONDENSER_CIRCULATION_PUMP_ORDERED_SPEED", Math.min(100, data.CONDENSER_CIRCULATION_PUMP_SPEED + 1), data.CONDENSER_CIRCULATION_PUMP_SPEED);
				}
			}
		}
	}


	// This function updates the running average of the data received from the webserver
	// It keeps the last 10 seconds of data and calculates the average and delta change
	function updateRunningAverage(variable, value) {
		if (isNaN(value)) return;

		if (!dataHistory[variable]) {
			dataHistory[variable] = [];
		}

		dataHistory[variable].push(value);

		// Keep only the last 10 seconds of data (assuming updates every second)
		if (dataHistory[variable].length > 10) {
			dataHistory[variable].shift();
		}

		// Calculate the actual average
		const sum = dataHistory[variable].reduce((acc, val) => acc + val, 0);
		dataAvg[variable] = sum / dataHistory[variable].length;

		// Calculate the average delta change
		if (dataHistory[variable].length > 1) {
			let deltaSum = dataHistory[variable][dataHistory[variable].length-1] - dataHistory[variable][0];
			/*for (let i = 1; i < dataHistory[variable].length; i++) {
				deltaSum += dataHistory[variable][i] - dataHistory[variable][i - 1];
			}*/
			dataAvgDelta[variable] = deltaSum / (dataHistory[variable].length - 1);
		} else {
			dataAvgDelta[variable] = 0;
		}
	}
	
	// Initialize the data collection loop
	function createUpdateFunction(variable) {
		return function (result) {
			// Check if the result is a number
			const value = parseFloat(result);
			if (!isNaN(value)) {
				data[variable] = value;
				updateRunningAverage(variable, value);
			} else {
				// If not a number, store it as a string
				data[variable] = result;
			}
		};
	}
	function collectData() {
		updateSVGValues();
		// Loop through all SUBSCRIPTIONS and get the latest values from the webserver
		SUBSCRIPTIONS.forEach(function(variable) {
			$.ajax({
				mimeType:	'text/plain; charset=x-user-undefined',
				url:		'http://localhost:8785/?Variable=' + variable,
				type:		'GET',
				dataType:	'text',
				success:	createUpdateFunction(variable)
				});
		});
	}

	// Send a new value to the webserver
	function sendValue(variable, value, oldValue) {
		console.log("Sending variable %s with new value %s (old value %s)", variable, value, oldValue);
		$.ajax({
			mimeType:	'text/plain; charset=x-user-undefined',
			url:		'http://localhost:8785/?Variable=' + variable + '&Value=' + value,
			type:		'POST',
			dataType:	'text'
			});
	}

	// Load the variables list
	// Use http://localhost:8785/?variable=WEBSERVER_LIST_VARIABLES
	function setUpVariables(result) {
		result.split("\n").forEach((line) => {
			let [type,vars] = line.split(':');
			VARIABLES[type] = vars.split(',');
		});
		console.log("Received VARIABLES", VARIABLES);
		initSubscribers();
		setInterval(collectData, 1000);
		setInterval(automateLoop, 10000);
	}

	// Start the whole page
	var pageInitialized = false;
	$(document).ready(function() {
		// Prevent multiple initializations because I was seeing multiple timers running
		if (pageInitialized) return;
		pageInitialized = true;

		$.ajax({
			mimeType:	'text/plain; charset=x-user-undefined',
		url:		'http://localhost:8785/?Variable=WEBSERVER_LIST_VARIABLES',
			type:		'GET',
			dataType:	'text',
			success:	setUpVariables
			});
	});
</script>
